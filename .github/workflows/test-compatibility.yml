name: Test Plugin Compatibility

env:
  # 默认测试版本（push/PR 触发时用这套；手动触发可覆盖）
  DEFAULT_VERSIONS: '1.20.1,1.21.11,26.2'

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: '要测试的 MC 版本，逗号分隔（留空用默认列表）'
        required: false
        default: '1.20.1,1.21.11,26.2'

jobs:
  # 把版本串拆成矩阵：手动触发用输入值，push/PR 用默认列表
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.split.outputs.versions }}
    steps:
      - name: Split versions input
        id: split
        run: |
          RAW="${{ github.event.inputs.versions }}"
          [ -z "$RAW" ] && RAW="$DEFAULT_VERSIONS"
          # 去空格、按逗号拆分成 JSON 数组
          VERSIONS=$(echo "$RAW" | tr -d ' ' | tr ',' '\n' | jq -R . | jq -sc .)
          echo "Test versions: $VERSIONS"
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 21 跑旧版本；26.x 起的 Paper 要求 Java 25
          java-version: |
            21
            25
          cache: gradle

      - name: Build plugin
        run: |
          ./gradlew clean build -x test

          # 版本号从 Gradle 工程取（plugin.yml 里是 ${version} 占位符，最终值由 Gradle 注入）
          PROPS=$(./gradlew -q properties)
          PLUGIN_VERSION=$(echo "$PROPS" | grep -oP '^version: \K.*' | head -n 1)
          echo "Gradle project version: $PLUGIN_VERSION"
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> $GITHUB_ENV

      # 提前解析最新 build 号：缓存 key 挂上它，Paper 出新 build 才 cache miss，
      # 否则命中缓存直接跳过下载（同时校验版本是否存在、取最低 Java 要求）
      - name: Resolve Paper version and build
        id: resolve
        env:
          VER: ${{ matrix.version }}
        run: |
          RESOLVE=$(python3 << 'EOF' 2>&1
          import json, os, urllib.request

          ver = os.environ['VER']
          UA = {'User-Agent': 'NetworksExpansion-CI'}

          def fetch(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          data = fetch('https://fill.papermc.io/v3/projects/paper/versions')
          items = data['versions'] if isinstance(data, dict) else data
          ids = [v['version']['id'] for v in items]

          if ver not in ids:
              # 前缀匹配：输入 26.1 → 提示 26.1.1 / 26.1.2
              near = sorted(i for i in ids if i.startswith(ver + '.'))
              print('SUGGEST=' + ', '.join(near) if near else 'NO_SUGGEST')
              raise SystemExit(0)

          print('EXISTS')
          entry = next(v for v in items if v['version']['id'] == ver)
          minimum = entry['version'].get('java', {}).get('version', {}).get('minimum', 21)
          print(f'MINJAVA={minimum}')

          builds = fetch(f'https://fill.papermc.io/v3/projects/paper/versions/{ver}/builds')
          if isinstance(builds, dict) or not builds:
              raise SystemExit(f'builds API 返回异常: {json.dumps(builds)[:300]}')
          latest = max(builds, key=lambda b: b.get('id', 0))
          url = (latest.get('downloads') or {}).get('server:default', {}).get('url')
          if not url:
              raise SystemExit(f"build {latest.get('id')} 没有下载地址: {json.dumps(latest)[:300]}")
          print(f'BUILD={latest.get("id")}')
          print(f'URL={url}')
          EOF
          ) || {
            echo "::error::校验 Paper $VER 时出错: $RESOLVE"
            exit 1
          }

          if [[ "$RESOLVE" == SUGGEST=* ]]; then
            echo "::notice::Paper $VER 不存在。Did you mean: ${RESOLVE#SUGGEST=}"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "$RESOLVE" == NO_SUGGEST* ]]; then
            echo "::error::Paper $VER 不存在，且没有以它开头的相近版本号，无法测试"
            exit 1
          fi
          if [[ "$RESOLVE" != *EXISTS* ]]; then
            echo "::error::Paper $VER: $RESOLVE"
            exit 1
          fi

          BUILD=$(echo "$RESOLVE" | grep -oP 'BUILD=\K\d+' | head -n 1)
          MINJAVA=$(echo "$RESOLVE" | grep -oP 'MINJAVA=\K\d+' | head -n 1)
          URL=$(echo "$RESOLVE" | grep -oP 'URL=\K.*' | head -n 1)
          MINJAVA=${MINJAVA:-21}
          echo "Paper $VER build $BUILD，最低 Java 要求: $MINJAVA"
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "minjava=$MINJAVA" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      # 缓存 Paper 服务端本体（jar + 原版库 + 补丁产物），key 按 build 号区分：
      # 新 build 出来自动 miss 重下，旧 build 命中后由后续步骤跳过下载
      - name: Cache Paper server
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            server/paper.jar
            server/cache
            server/caches
            server/libraries
            server/versions
          key: paper-server-${{ matrix.version }}-${{ steps.resolve.outputs.build }}

      - name: Download dependencies
        if: steps.resolve.outputs.skip != 'true'
        run: |
          mkdir -p server/plugins

          # 依赖插件
          # Networks 的 plugin.yml 里 depend: [Slimefun]，不装 Slimefun 会被 Bukkit 拒绝启用
          # 用 GuguProject 构建源（与仓库编译目标对齐）
          curl -L -o server/plugins/Slimefun4.jar \
            "https://resources.guizhanss.com/api/v1/projects/Slimefun4/versions/master-271/download"

          curl -L -o server/plugins/GuizhanLibPlugin.jar \
            "https://resources.guizhanss.com/api/v1/projects/GuizhanLibPlugin/versions/build-61/download"

      - name: Run Paper server and load plugin
        id: run-server
        if: steps.resolve.outputs.skip != 'true'
        run: |
          cp build/libs/*.jar server/plugins/

          VER="${{ matrix.version }}"
          MINJAVA="${{ steps.resolve.outputs.minjava }}"
          DOWNLOAD_URL="${{ steps.resolve.outputs.url }}"

          echo "Paper $VER 最低 Java 要求: $MINJAVA"
          if [ "$MINJAVA" -gt 25 ]; then
            echo "::error::Paper $VER 需要 Java $MINJAVA，超出当前 CI 预装范围（21/25），请在 setup-java 中补充"
            exit 1
          elif [ "$MINJAVA" -gt 21 ]; then
            if [ -n "$JAVA_HOME_25_X64" ]; then
              export JAVA_HOME="$JAVA_HOME_25_X64"
              export PATH="$JAVA_HOME/bin:$PATH"
              echo "Using Java 25 for Paper $VER: $(java -version 2>&1 | head -n 1)"
            else
              echo "::warning::找不到 JAVA_HOME_25_X64，Paper $VER 可能无法启动"
            fi
          fi

          # 缓存命中时 paper.jar 已由 actions/cache 恢复，跳过下载；未命中才拉取
          if [ -s server/paper.jar ]; then
            echo "命中缓存 server/paper.jar，跳过下载"
          else
            echo "Downloading Paper $VER: $DOWNLOAD_URL"
            curl -L -o server/paper.jar "$DOWNLOAD_URL"
          fi

          # 接受 EULA，静默启动配置
          echo "eula=true" > server/eula.txt
          echo "online-mode=false" > server/server.properties
          echo "level-type=flat" >> server/server.properties
          echo "generate-structures=false" >> server/server.properties

          # 启动服务端；后台监视进程盯 console.log，出现 "Done ("（开服完成）后发 stop 正常关服；
          # 外层 timeout 600 兜底（paperclip 首次启动要解压原版 jar + 装库，较慢）
          cd server
          rm -f in.fifo
          mkfifo in.fifo
          ( for i in $(seq 1 110); do grep -q 'Done (' console.log 2>/dev/null && break; sleep 5; done; sleep 5; echo stop > in.fifo ) &
          MON_PID=$!
          timeout 600 java -Xmx2G -jar paper.jar nogui < in.fifo > console.log 2>&1 || true
          kill $MON_PID 2>/dev/null || true
          rm -f in.fifo
          cd ..

          # 服务端控制台日志全量打到 job 日志，方便直接在页面看
          echo "======== server console.log ========"
          cat server/console.log || true
          echo "======== end of console.log ========"

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.version }}
          path: server/console.log
          if-no-files-found: warn

      - name: Check server logs
        if: steps.resolve.outputs.skip != 'true'
        run: |
          LOG_FILE=server/console.log
          if [ ! -f "$LOG_FILE" ]; then
            echo "::error::没有找到日志文件，服务端可能根本没启动"
            exit 1
          fi

          # 插件名/版本从构建产物 jar 内的 plugin.yml 取（Gradle 工程名 NetworksExpansion ≠ Bukkit 插件名 Networks）；
          # plugin.yml 的 ${version} 占位符在 processResources 阶段已被 Gradle 版本号替换
          JAR=$(ls build/libs/*.jar | head -n 1)
          PLUGIN_NAME=$(unzip -p "$JAR" plugin.yml | grep -oP '^name: *\K.*' | head -n 1)
          PLUGIN_VERSION=$(unzip -p "$JAR" plugin.yml | grep -oP '^version: *\K.*' | head -n 1)
          echo "Testing plugin: $PLUGIN_NAME v$PLUGIN_VERSION"

          # 以 "Done (x.xxs)!" 为界：插件在 Done 之前被 Disabling = 开服阶段就炸了，判失败
          DONE_LINE=$(grep -n 'Done (' "$LOG_FILE" | head -n 1 | cut -d: -f1)
          if [ -z "$DONE_LINE" ]; then
            echo "::error::服务端在 MC ${{ matrix.version }} 上没能完成启动（未找到 Done 行）"
            exit 1
          fi

          DISABLE_LINE=$(grep -n "\[${PLUGIN_NAME}\] Disabling ${PLUGIN_NAME}" "$LOG_FILE" | head -n 1 | cut -d: -f1)
          if [ -n "$DISABLE_LINE" ] && [ "$DISABLE_LINE" -lt "$DONE_LINE" ]; then
            echo "::error::插件在 MC ${{ matrix.version }} 上开服阶段即被禁用（Disabling 出现在 Done 之前）"
            grep -n "Disabling ${PLUGIN_NAME}" "$LOG_FILE"
            exit 1
          fi

          # 没出现 Enabling 说明插件压根没加载成功（崩溃/依赖缺失）
          if ! grep -q "Enabling ${PLUGIN_NAME}" "$LOG_FILE"; then
            echo "::error::插件在 MC ${{ matrix.version }} 上未成功启用（未找到 Enabling 日志）"
            exit 1
          fi

          echo "✅ OK: 插件在 MC ${{ matrix.version }} 上正常启用"
