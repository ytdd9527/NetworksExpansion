name: Test Plugin Compatibility

on:
  workflow_dispatch:
    inputs:
      versions:
        description: '要测试的 MC 版本，逗号分隔（如 1.21.8,1.20.6）'
        required: true
        default: '1.21.8'

jobs:
  # 把手动输入的版本串拆成矩阵
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.split.outputs.versions }}
    steps:
      - name: Split versions input
        id: split
        run: |
          # 去空格、按逗号拆分成 JSON 数组
          VERSIONS=$(echo "${{ github.event.inputs.versions }}" | tr -d ' ' | tr ',' '\n' | jq -R . | jq -sc .)
          echo "Test versions: $VERSIONS"
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build plugin
        run: |
          ./gradlew clean build -x test

      - name: Run Paper server and load plugin
        id: run-server
        run: |
          mkdir -p server/plugins
          cp build/libs/*.jar server/plugins/

          # 依赖插件
          curl -L -o server/plugins/GuizhanLibPlugin.jar \
            "https://resources.guizhanss.com/api/v1/projects/GuizhanLibPlugin/versions/build-61/download"

          # 从 Paper v3 API 获取最新 build 的 paperclip jar（v2 API 已 410 下线）
          DOWNLOAD_URL=$(curl -s "https://fill.papermc.io/v3/projects/paper/versions/${{ matrix.version }}/builds/latest" | jq -r '.downloads["server:default"].url')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "::error::Paper ${{ matrix.version }} 没有可用的 build（版本不存在或尚未发布）"
            exit 1
          fi
          echo "Downloading: $DOWNLOAD_URL"
          curl -L -o server/paper.jar "$DOWNLOAD_URL"

          # 接受 EULA，静默启动配置
          echo "eula=true" > server/eula.txt
          echo "online-mode=false" > server/server.properties
          echo "level-type=flat" >> server/server.properties
          echo "generate-structures=false" >> server/server.properties

          # 启动服务端，240 秒后强制终止（插件在 ENABLE 阶段就会打日志，无需等世界生成完）
          cd server
          timeout 240 java -Xmx2G -jar paper.jar nogui > console.log 2>&1 || true
          cd ..

          echo "---- console tail ----"
          tail -n 40 server/console.log || true

      - name: Check server logs
        run: |
          LOG_FILE=server/console.log
          if [ ! -f "$LOG_FILE" ]; then
            echo "::error::没有找到日志文件，服务端可能根本没启动"
            exit 1
          fi

          PLUGIN_NAME="Networks"

          # 1) 出现 Disabling 即判定加载失败
          if grep -q "\[${PLUGIN_NAME}\] Disabling ${PLUGIN_NAME}" "$LOG_FILE"; then
            echo "::error::插件在 MC ${{ matrix.version }} 上被禁用（Disabling）"
            grep -n "Disabling ${PLUGIN_NAME}" "$LOG_FILE"
            exit 1
          fi

          # 2) 没出现 Enabling 说明插件压根没加载成功（崩溃/依赖缺失）
          if ! grep -q "Enabling ${PLUGIN_NAME}" "$LOG_FILE"; then
            echo "::error::插件在 MC ${{ matrix.version }} 上未成功启用（未找到 Enabling 日志）"
            exit 1
          fi

          echo "✅ OK: 插件在 MC ${{ matrix.version }} 上正常启用"
