      - "<passive> 网络拓展开发版 Github 仓库: <click_info>https://github.com/balugaq/NetworksExpansion"
      - "<warning> 网络拓展开发版不接受 GitHub Issues"
      - "<warning> 网络拓展开发版不接受 GitHub PR"
      - "<passive> 网络拓展作者 GitHub 页面: <click_info>https://github.com/ytdd9527"
      - "<passive> 网络拓展作者 GitHub 页面: <click_info>https://github.com/balugaq"
  NTW_EXPANSION_ANNOUNCEMENT_05:
    name: "<color_random_string>网络拓展相关链接"
    lore:
      - "<warning> 阅读此声明前，请务必先阅读网络拓展相关答疑。"
      - "<warning> 1) 网络拓展开发者们没有义务维护此附属，对于稳定版网络拓展突然出现的错误、漏洞、问题，请及时向此附属稳定版 GitHub 仓库提交 Issue。"
      - "<passive> 2) 我们不能保证及时修复所有问题，但我们会尽力修复。"
      - "<passive> 3) 与开发者们交流时，应当保持礼貌，不要恶意攻击或辱骂。这才是有效的解决您的问题的沟通方式。"
      - "<warning> 4) 当您使用、游玩或修改网络拓展时，即默认您同意遵守这些声明。"
      - "<passive> 5) 网络拓展开发者们保留随时修改、终止本声明的权利。"
      - "<warning> 6) 当本声明更新后，您应自觉查阅是否有异议。通常来说，在版本更新后，网络拓展开发组默认您同意遵守这些声明。"
      - "<passive> 7) 您应避免因使用网络拓展而使\"网络拓展\"或\"网络拓展开发组\"或\"网络拓展开发组成员\"卷入政治和公共事件。<warning>否则网络拓展开发组有权暂停或终止对网络拓展的维护。"
      - "<passive> 8) 如若出现网络拓展开发者们发布的其他语言的此声明，请以中文版本为准。"
      - "<passive> 9) 本声明的生效、履行、解释及纠纷解决，适用中华人民共和国大陆地区法律（不包括冲突法）"
      - "<passive> 10) 本声明中存在的所有标题仅为阅读方便，本身并无任何实际涵义，不能作为本声明涵义解释的依据。"
      - "<warning> 11) 本声明无论因何种原因部分无效，其余条款仍有效，对各方具有约束力。"
      - "<warning> 12) 如因屏幕过小等原因，无法查看到完整的声明内容，请自行调整，网络拓展开发组对此不承担任何责任。"
      - "<warning> 13) 如因屏幕过小等原因，无法查看到完整的物品名称或物品解释，请服主或玩家自行解决，网络拓展开发组对此不承担任何责任。"
      - "<warning> 14) 网络拓展允许任何人以非盈利目的使用、复制、修改、合并、出版、发行、展览、分发此声明，但任何人不得将此声明用于商业目的。且禁止以网络拓展或网络拓展开发组名义进行任何宣传。"
      - "<warning> 15) 此附属所有声明解释权归网络拓展开发者们所有。"
  NTW_EXPANSION_ANNOUNCE_9:
    name: "<color_random_string>网络拓展版本信息"
    lore:
      - "<warning> 阅读此声明前，请务必先阅读网络拓展补充说明。"
      - "<passive> 开发者（们）: ytdd9527, balugaq"
      - "<passive> 开发者 GitHub 页面: <click_info>https://github.com/ytdd9527"
      - "<passive> 开发者 GitHub 页面: <click_info>https://github.com/balugaq"
      - "<passive> 网络拓展稳定版下载地址: https://builds.guizhanss.com/ytdd9527/NetworksExpansion/master/builds"
      - "<passive> 网络拓展开发版下载地址: https://github.com/balugaq/NetworksExpansion"
      - "<passive> 感谢为网络拓展开发贡献过自己的 Issue, PR, commit 的人!"
      - "<passive> 感谢为网络拓展开发提供建议的所有人!"
      - "<passive> 感谢为网络拓展开发提供建议的 Utoboy, TouRuya, haiman233, yitoudaidai, tinalness, matl114 等玩家!"
  NTW_EXPANSION_ANNOUNCE_10:
    name: "<color_random_string>网络拓展游玩体验声明"
    lore:
      - "<warning> 阅读此声明前，请务必先阅读网络拓展版本信息。"
      - "<passive> 关于网络合成机丢蓝图，根据粘液开发者发表的公告:"
      - "<passive> ——物品 PDC 数据过大时，物品无法被保存到粘液数据库中。需服主自行调整数据库表数据类型"
      - "<passive> ——并在设置中启用 `bypass-item-length-check` 选项以跳过物品大小检查。"
      - "<passive> 网络合成机的蓝图 PDC 通常十分巨大，这是为了兼容数年前的蓝图，确保玩家游玩体验。"
      - "<passive> 此外，根据 matl114 的测试，原地升级机器也有可能导致物品丢失:"
      - "<passive> 在此举出一个<warning>可能<passive>复现的例子: 放置A机器，在B槽放置C数量的D物品，挖掉并更换为E机器，在B槽放置C数量的D物品，"
      - "<passive> 服务器重启后，E机器中的D物品消失。"
      - "<passive> 以上原因与网络拓展并无太多关系，建议游玩时应保持理智，不要盲目对网络拓展进行言语攻击。"
      - "<passive> 声明到此结束。"

